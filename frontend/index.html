<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mininet UI</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Icon artwork, used by the toolbars (<use href="#i-...">) and by the
       canvas (<use href="#dev-...">). Drawn in the style of Packet Tracer. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="g-screen" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8cc4f5"/><stop offset="1" stop-color="#1f5fae"/>
      </linearGradient>
      <linearGradient id="g-case" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#f2f2f2"/><stop offset="1" stop-color="#c9c9c9"/>
      </linearGradient>

      <!-- PC: monitor + keyboard -->
      <symbol id="dev-host" viewBox="0 0 48 44">
        <rect x="6" y="2" width="36" height="26" rx="2" fill="url(#g-case)" stroke="#5f5f5f"/>
        <rect x="9" y="5" width="30" height="19" fill="url(#g-screen)" stroke="#3d5f86" stroke-width=".6"/>
        <rect x="21" y="28" width="6" height="4" fill="#9a9a9a"/>
        <path d="M5 33 H43 L46 42 H2 Z" fill="url(#g-case)" stroke="#5f5f5f"/>
        <path d="M9 36 H39 M7 39 H41" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 1"/>
      </symbol>

      <!-- Switch: blue box in perspective with traffic arrows on top -->
      <symbol id="dev-switch" viewBox="0 0 56 40">
        <path d="M10 5 H54 L46 16 H2 Z" fill="#76aee3" stroke="#1d4f82"/>
        <rect x="2" y="16" width="44" height="19" fill="#2c6db3" stroke="#1d4f82"/>
        <path d="M46 16 L54 5 V24 L46 35 Z" fill="#1f5895" stroke="#1d4f82"/>
        <g stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 8.5 H31 M28 6.8 L31 8.5 L28 10.2"/>
          <path d="M40 12.8 H22 M25 11.1 L22 12.8 L25 14.5"/>
        </g>
        <g fill="#cfe4fa">
          <rect x="6" y="24" width="3" height="3"/><rect x="11" y="24" width="3" height="3"/>
          <rect x="16" y="24" width="3" height="3"/><rect x="21" y="24" width="3" height="3"/>
          <rect x="26" y="24" width="3" height="3"/><rect x="31" y="24" width="3" height="3"/>
          <rect x="36" y="24" width="3" height="3"/>
        </g>
      </symbol>

      <!-- Controller: server tower -->
      <symbol id="dev-controller" viewBox="0 0 40 48">
        <rect x="8" y="2" width="24" height="44" rx="2" fill="url(#g-case)" stroke="#5f5f5f"/>
        <rect x="12" y="7" width="16" height="4" fill="#8f8f8f"/>
        <rect x="12" y="13" width="16" height="4" fill="#8f8f8f"/>
        <rect x="12" y="20" width="16" height="3" fill="#7c3aed"/>
        <path d="M12 28 H28 M12 31 H28 M12 34 H28" stroke="#a3a3a3"/>
        <circle cx="20" cy="40" r="1.8" fill="#22c55e"/>
      </symbol>

      <!-- toolbar icons -->
      <symbol id="i-select" viewBox="0 0 24 24">
        <path d="M6 3 V19 L10 15 L13 21.5 L15.6 20.3 L12.7 14 H18.5 Z"
              fill="#fff" stroke="#222" stroke-width="1.4" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-delete" viewBox="0 0 24 24">
        <path d="M6 6 L18 18 M18 6 L6 18" stroke="#d32f2f" stroke-width="3.2" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-link" viewBox="0 0 24 24">
        <path d="M13.5 2 L4 14 H11 L9 22 L20 9 H13 Z" fill="#f5b301" stroke="#8a5a00"
              stroke-width="1.2" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-note" viewBox="0 0 24 24">
        <path d="M3.5 3.5 H20.5 V15 L15 20.5 H3.5 Z" fill="#fff4a3" stroke="#a88600"/>
        <path d="M20.5 15 H15 V20.5" fill="#f0d96a" stroke="#a88600"/>
        <path d="M7 8 H17 M7 11.5 H17 M7 15 H12" stroke="#7a6200" stroke-width="1.2"/>
      </symbol>
      <symbol id="i-new" viewBox="0 0 24 24">
        <!-- page with a green "+" badge; strong outline so it shows on the grey toolbar -->
        <path d="M4.5 2 H13 L18 7 V21 H4.5 Z" fill="#fff" stroke="#3a3a3a" stroke-width="1.4"
              stroke-linejoin="round"/>
        <path d="M13 2 V7 H18" fill="#d9d9d9" stroke="#3a3a3a" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M7.5 11 H14 M7.5 14 H12" stroke="#9a9a9a" stroke-width="1.2"/>
        <circle cx="17.5" cy="17.5" r="5" fill="#2e9e44" stroke="#fff" stroke-width="1"/>
        <path d="M17.5 14.8 V20.2 M14.8 17.5 H20.2" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-open" viewBox="0 0 24 24">
        <path d="M2.5 5.5 H9 L11 7.5 H20.5 V19.5 H2.5 Z" fill="#e9b62c" stroke="#8f6a00"/>
        <path d="M2.5 19.5 L5.5 10.5 H23 L20.5 19.5 Z" fill="#f7d35c" stroke="#8f6a00"/>
      </symbol>
      <symbol id="i-save" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="1.5" fill="#3b6fb6" stroke="#22477c"/>
        <rect x="6.5" y="3" width="11" height="6.5" fill="#e8eef7"/>
        <rect x="13.5" y="4" width="2.5" height="4.5" fill="#22477c"/>
        <rect x="6" y="13" width="12" height="8" fill="#fff"/>
      </symbol>
      <symbol id="i-export" viewBox="0 0 24 24">
        <path d="M5 2.5 H13 L18 7.5 V21.5 H5 Z" fill="#fff" stroke="#3a3a3a" stroke-width="1.4"
              stroke-linejoin="round"/>
        <path d="M13 2.5 V7.5 H18" fill="#d9d9d9" stroke="#3a3a3a" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M11.5 9 V17.5 M8 14 L11.5 17.5 L15 14" fill="none" stroke="#2e7d32"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <!-- gear: 8 teeth around a ring -->
        <path d="M10.3 2.5 H13.7 L14.2 5.2 L16.4 6.1 L18.7 4.6 L21.1 7 L19.6 9.3 L20.5 11.5 L23 12
                 V13.4 L20.5 13.9 L19.6 16.1 L21.1 18.4 L18.7 20.8 L16.4 19.3 L14.2 20.2 L13.7 22.5
                 H10.3 L9.8 20.2 L7.6 19.3 L5.3 20.8 L2.9 18.4 L4.4 16.1 L3.5 13.9 L1 13.4 V12
                 L3.5 11.5 L4.4 9.3 L2.9 7 L5.3 4.6 L7.6 6.1 L9.8 5.2 Z"
              fill="#8a96a3" stroke="#4a5561" stroke-width="1" stroke-linejoin="round"/>
        <circle cx="12" cy="12.7" r="3.6" fill="#ececec" stroke="#4a5561" stroke-width="1"/>
      </symbol>
      <symbol id="i-run" viewBox="0 0 24 24">
        <path d="M7 4.5 L19.5 12 L7 19.5 Z" fill="#2e9e44" stroke="#1b6b2c" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-stop" viewBox="0 0 24 24">
        <rect x="5.5" y="5.5" width="13" height="13" rx="1.5" fill="#d32f2f" stroke="#8e1b1b"/>
      </symbol>
    </defs>
  </svg>

  <header id="titlebar">
    <span class="brand">Mininet UI</span>
    <span id="file-name">topology</span>
  </header>

  <nav id="toolbar">
    <button id="btn-new" class="icon-btn" title="New topology">
      <svg class="icon"><use href="#i-new"/></svg></button>
    <button id="btn-open" class="icon-btn" title="Open a .mn (MiniEdit) or .json file">
      <svg class="icon"><use href="#i-open"/></svg></button>
    <button id="btn-save" class="icon-btn" title="Save as .mn (MiniEdit format) or .json">
      <svg class="icon"><use href="#i-save"/></svg></button>
    <button id="btn-export" class="icon-btn" title="Export a standalone Mininet Python script">
      <svg class="icon"><use href="#i-export"/></svg></button>
    <button id="btn-settings" class="icon-btn" title="Network settings: OpenFlow versions, IP base, sFlow, NetFlow...">
      <svg class="icon"><use href="#i-settings"/></svg></button>
    <input type="file" id="file-input" accept=".mn,.json,application/json" hidden>

    <span class="tb-sep"></span>
    <button id="btn-run" class="icon-btn labelled" title="Start the network in Mininet">
      <svg class="icon"><use href="#i-run"/></svg>Run</button>
    <button id="btn-stop" class="icon-btn labelled" disabled title="Stop the network">
      <svg class="icon"><use href="#i-stop"/></svg>Stop</button>
    <span id="net-status" class="badge">stopped</span>
    <span id="ctl-status" class="badge" hidden
          title="Are the switches connected to the controller? (asked from Open vSwitch)"></span>

    <span class="tb-sep"></span>
    <label title="Poll the controller's REST API every 3 s and colour the canvas">
      Live view
      <select id="live-source">
        <option value="">off</option>
        <option value="onos">ONOS</option>
        <option value="odl">OpenDaylight</option>
      </select>
    </label>
    <span id="live-status" class="muted"></span>
  </nav>

  <main>
    <aside id="sidebar">
      <div class="section">Tools</div>
      <button data-tool="select" class="tool active" title="Select / move (Esc)">
        <svg class="icon"><use href="#i-select"/></svg>Select</button>
      <button data-tool="delete" class="tool" title="Click a device or link to delete it (Del)">
        <svg class="icon"><use href="#i-delete"/></svg>Delete</button>
      <button data-tool="note" class="tool" title="Note: click the workspace to place a text note">
        <svg class="icon"><use href="#i-note"/></svg>Note</button>

      <div class="section">Devices</div>
      <button data-tool="host" class="tool" title="Host: click the workspace to place it">
        <svg class="icon dev"><use href="#dev-host"/></svg>PC</button>
      <button data-tool="switch" class="tool" title="OpenFlow switch: click the workspace to place it">
        <svg class="icon dev"><use href="#dev-switch"/></svg>Switch</button>
      <button data-tool="controller" class="tool" title="SDN controller: click the workspace to place it">
        <svg class="icon dev"><use href="#dev-controller"/></svg>Controller</button>

      <div class="section">Connections</div>
      <button data-tool="link" class="tool" title="Link: click two devices to connect them">
        <svg class="icon"><use href="#i-link"/></svg>Link</button>
    </aside>

    <svg id="canvas">
      <g id="layer-links"></g>
      <line id="rubber-band" visibility="hidden"></line>
      <g id="layer-nodes"></g>
      <g id="layer-notes"></g>
    </svg>

    <aside id="props">
      <h2>Properties</h2>
      <div id="props-body"></div>
    </aside>
  </main>

  <section id="console">
    <div class="console-bar">
      <label>Host <select id="cmd-node"></select></label>
      <input id="cmd-input" placeholder="command, e.g. ifconfig  (Enter to run)" autocomplete="off">
      <button id="btn-cmd">Run cmd</button>
      <span class="sep"></span>
      <label>to <select id="cmd-target"></select></label>
      <button id="btn-ping">Ping</button>
      <button id="btn-iperf">iperf</button>
      <button id="btn-pingall">Ping all</button>
      <span class="sep"></span>
      <button id="btn-clear">Clear</button>
    </div>
    <pre id="console-out"></pre>
  </section>

  <script src="state.js"></script>
  <script src="mnfile.js"></script>
  <script src="canvas.js"></script>
  <script src="ui.js"></script>
</body>
</html>
